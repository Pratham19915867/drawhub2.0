<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 DrawTogether - Multiplayer Drawing Game</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --accent: #f59e0b;
            --success: #22c55e;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 10px 40px rgba(0,0,0,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* =============== SCREENS =============== */
        .screen { display: none; width: 100%; min-height: 100vh; }
        .screen.active { display: flex; }

        /* =============== LOBBY SCREEN =============== */
        #lobbyScreen {
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            padding: 20px;
        }

        .lobby-container {
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-logo {
            font-family: 'Fredoka One', cursive;
            font-size: 48px;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .game-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Server Status Banner */
        .status-banner {
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .status-banner.connecting { background: #fef3c7; color: #d97706; }
        .status-banner.connected { background: #dcfce7; color: #15803d; }
        .status-banner.error { background: #fee2e2; color: #dc2626; }

        .input-group { margin-bottom: 16px; }

        .input-group label {
            display: block;
            text-align: left;
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 6px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        }

        .btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-accent {
            background: linear-gradient(135deg, #f59e0b, #f97316);
            color: white;
            width: 100%;
            margin-top: 10px;
        }

        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }
        .divider::before { margin-right: 16px; }
        .divider::after { margin-left: 16px; }

        .error-msg {
            color: var(--danger);
            font-size: 14px;
            font-weight: 700;
            margin-top: 10px;
            display: none;
        }
        .error-msg.show { display: block; }

        /* =============== WAITING ROOM =============== */
        #waitingScreen {
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .waiting-container {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow);
            max-width: 550px;
            width: 100%;
            text-align: center;
            animation: slideUp 0.6s ease;
        }

        .room-code-display {
            font-family: 'Fredoka One', cursive;
            font-size: 48px;
            letter-spacing: 8px;
            color: var(--primary);
            background: #f1f5f9;
            padding: 15px 30px;
            border-radius: 16px;
            margin: 20px auto;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .player-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: #f8fafc;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
        }

        /* =============== GAME SCREEN =============== */
        #gameScreen { flex-direction: column; height: 100vh; padding: 10px; }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            color: white;
        }

        .game-content {
            display: grid;
            grid-template-columns: 260px 1fr 300px;
            gap: 12px;
            flex: 1;
            min-height: 0;
        }

        .game-panel {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 12px;
        }

        .canvas-panel { background: #f1f5f9; padding: 0; }

        .word-display {
            text-align: center;
            padding: 10px;
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            letter-spacing: 6px;
            color: var(--text);
            background: white;
            border-bottom: 1px solid var(--border);
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .canvas-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            position: relative;
        }

        #drawCanvas {
            background: white;
            border-radius: 8px;
            cursor: crosshair;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg { padding: 8px 12px; border-radius: 10px; font-size: 14px; background: #f8fafc; }
        .msg-system { background: #eff6ff; color: #1d4ed8; font-weight: 700; text-align: center; }
        .msg-correct { background: #dcfce7; color: #15803d; font-weight: 800; text-align: center; }

        .chat-input-box { display: flex; gap: 8px; margin-top: 10px; }
        .chat-input-box input { flex: 1; padding: 10px; border: 2px solid var(--border); border-radius: 10px; outline: none; }
        .chat-input-box button { padding: 10px 16px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 800; cursor: pointer; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); display: none;
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-overlay.show { display: flex; }
        .modal-content { background: white; border-radius: 24px; padding: 30px; text-align: center; max-width: 450px; width: 90%; }
        .word-choice-btn { width: 100%; padding: 14px; margin-bottom: 8px; border: 2px solid var(--border); border-radius: 12px; font-size: 20px; font-family: 'Fredoka One'; cursor: pointer; }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div class="screen active" id="lobbyScreen">
        <div class="lobby-container">
            <div class="game-logo">DrawTogether</div>
            <div class="game-subtitle">🎨 Draw, Guess & Have Fun with Friends!</div>

            <!-- Server Status Indicator -->
            <div class="status-banner connecting" id="statusBanner">
                <span>⏳ Connecting to Server...</span>
            </div>

            <div class="input-group">
                <label>👤 Your Name</label>
                <input type="text" id="playerNameInput" placeholder="Enter your name..." maxlength="15" autocomplete="off">
            </div>

            <button class="btn btn-primary" id="createRoomBtn">🏠 Create New Room</button>

            <div class="divider">OR JOIN A ROOM</div>

            <div class="input-group">
                <label>🔑 Room Code</label>
                <input type="text" id="roomCodeInput" placeholder="ENTER ROOM CODE..." maxlength="6" style="text-transform: uppercase; letter-spacing: 3px; text-align: center; font-family: 'Fredoka One', cursive; font-size: 20px;" autocomplete="off">
            </div>

            <button class="btn btn-accent" id="joinRoomBtn">🚀 Join Room</button>

            <div class="error-msg" id="lobbyError"></div>
        </div>
    </div>

    <!-- WAITING ROOM SCREEN -->
    <div class="screen" id="waitingScreen">
        <div class="waiting-container">
            <div class="game-logo" style="font-size: 36px;">DrawTogether</div>
            <div style="color: var(--text-muted); margin-top: 5px;">Share code with friends:</div>

            <div class="room-code-display" id="roomCodeDisplay">------</div>

            <div style="margin: 15px 0; font-weight: 700;">
                Players Joined: <span id="waitingPlayerCount">0</span>
            </div>

            <div class="players-grid" id="waitingPlayersList"></div>

            <button class="btn btn-success" id="startGameBtn" style="width: 100%; margin-top: 16px; display: none;">
                🎮 Start Game!
            </button>
            <div id="waitingMsg" style="color: var(--text-muted); font-size: 14px; margin-top: 10px;">Waiting for players...</div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div class="screen" id="gameScreen">
        <div class="game-header">
            <div style="font-family: 'Fredoka One'; font-size: 22px;">🎨 DrawTogether</div>
            <div id="roundInfo" style="background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 12px; font-weight: 700;">Round 1</div>
        </div>

        <div class="game-content">
            <div class="game-panel">
                <div style="font-weight: 800; margin-bottom: 10px;">Players</div>
                <div id="gamePlayerList" style="flex: 1; overflow-y: auto;"></div>
                <div id="timerDisplay" style="font-family: 'Fredoka One'; font-size: 32px; text-align: center; margin-top: 10px;">⏳ 80s</div>
            </div>

            <div class="game-panel canvas-panel">
                <div class="word-display" id="wordDisplay">Waiting...</div>
                <div class="canvas-wrapper">
                    <canvas id="drawCanvas" width="700" height="450"></canvas>
                </div>
            </div>

            <div class="game-panel">
                <div style="font-weight: 800; margin-bottom: 10px;">Chat & Guesses</div>
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-box">
                    <input type="text" id="chatInput" placeholder="Type guess..." autocomplete="off">
                    <button id="chatSendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- WORD CHOICE MODAL -->
    <div class="modal-overlay" id="wordChoiceModal">
        <div class="modal-content">
            <div style="font-size: 40px; margin-bottom: 10px;">🎨</div>
            <div style="font-family: 'Fredoka One'; font-size: 24px; margin-bottom: 15px;">Choose a Word!</div>
            <div id="wordChoicesList"></div>
        </div>
    </div>

    <!-- ROUND END MODAL -->
    <div class="modal-overlay" id="roundEndModal">
        <div class="modal-content">
            <div style="font-size: 40px;" id="roundEndEmoji">⏰</div>
            <div style="font-family: 'Fredoka One'; font-size: 24px;" id="roundEndTitle">Time's Up!</div>
            <div style="font-size: 28px; font-family: 'Fredoka One'; color: var(--primary); margin: 15px 0;" id="roundEndWord">WORD</div>
            <div id="roundEndScoreboard"></div>
        </div>
    </div>

    <script>
        // AUTO-DETECT BACKEND URL (Works both locally AND on public deployed websites)
        const BACKEND_URL = window.location.origin.includes('http') ? window.location.origin : 'http://localhost:3000';
        const socket = io(BACKEND_URL, { transports: ['websocket', 'polling'] });

        let myId = null;
        let myName = '';
        let currentRoomCode = '';
        let isHost = false;
        let isDrawer = false;
        let gamePhase = 'waiting';

        const screens = {
            lobby: document.getElementById('lobbyScreen'),
            waiting: document.getElementById('waitingScreen'),
            game: document.getElementById('gameScreen')
        };

        const elements = {
            playerNameInput: document.getElementById('playerNameInput'),
            roomCodeInput: document.getElementById('roomCodeInput'),
            createRoomBtn: document.getElementById('createRoomBtn'),
            joinRoomBtn: document.getElementById('joinRoomBtn'),
            lobbyError: document.getElementById('lobbyError'),
            statusBanner: document.getElementById('statusBanner'),
            roomCodeDisplay: document.getElementById('roomCodeDisplay'),
            waitingPlayerCount: document.getElementById('waitingPlayerCount'),
            waitingPlayersList: document.getElementById('waitingPlayersList'),
            startGameBtn: document.getElementById('startGameBtn'),
            waitingMsg: document.getElementById('waitingMsg'),
            roundInfo: document.getElementById('roundInfo'),
            gamePlayerList: document.getElementById('gamePlayerList'),
            timerDisplay: document.getElementById('timerDisplay'),
            wordDisplay: document.getElementById('wordDisplay'),
            chatMessages: document.getElementById('chatMessages'),
            chatInput: document.getElementById('chatInput'),
            chatSendBtn: document.getElementById('chatSendBtn'),
            wordChoiceModal: document.getElementById('wordChoiceModal'),
            wordChoicesList: document.getElementById('wordChoicesList'),
            roundEndModal: document.getElementById('roundEndModal'),
            roundEndEmoji: document.getElementById('roundEndEmoji'),
            roundEndTitle: document.getElementById('roundEndTitle'),
            roundEndWord: document.getElementById('roundEndWord'),
            roundEndScoreboard: document.getElementById('roundEndScoreboard')
        };

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        function showScreen(name) {
            Object.values(screens).forEach(s => s.classList.remove('active'));
            screens[name].classList.add('active');
        }

        function showError(msg) {
            elements.lobbyError.textContent = msg;
            elements.lobbyError.classList.add('show');
            setTimeout(() => elements.lobbyError.classList.remove('show'), 4000);
        }

        // SOCKET STATUS HANDLERS
        socket.on('connect', () => {
            elements.statusBanner.className = 'status-banner connected';
            elements.statusBanner.innerHTML = '<span>🟢 Server Connected! Ready to Play</span>';
            elements.createRoomBtn.disabled = false;
            elements.joinRoomBtn.disabled = false;
        });

        socket.on('connect_error', () => {
            elements.statusBanner.className = 'status-banner error';
            elements.statusBanner.innerHTML = '<span>🔴 Server Waking Up... Please wait 10s</span>';
        });

        socket.on('disconnect', () => {
            elements.statusBanner.className = 'status-banner connecting';
            elements.statusBanner.innerHTML = '<span>⏳ Reconnecting to Server...</span>';
        });

        // LOBBY EVENTS
        elements.createRoomBtn.addEventListener('click', () => {
            const name = elements.playerNameInput.value.trim();
            if (!name) { showError('Please enter your name!'); return; }
            if (!socket.connected) { showError('Connecting to server... Try again in 5 seconds!'); return; }
            
            myName = name;
            elements.createRoomBtn.disabled = true;
            elements.createRoomBtn.textContent = '⏳ Creating Room...';
            socket.emit('create_room', { playerName: name });
        });

        elements.joinRoomBtn.addEventListener('click', () => {
            const name = elements.playerNameInput.value.trim();
            const code = elements.roomCodeInput.value.trim().toUpperCase();
            if (!name) { showError('Please enter your name!'); return; }
            if (!code) { showError('Please enter room code!'); return; }
            if (!socket.connected) { showError('Connecting to server... Try again in 5 seconds!'); return; }

            myName = name;
            socket.emit('join_room', { playerName: name, roomCode: code });
        });

        // ROOM SOCKET EVENTS
        socket.on('room_created', (data) => {
            elements.createRoomBtn.disabled = false;
            elements.createRoomBtn.textContent = '🏠 Create New Room';
            myId = socket.id;
            currentRoomCode = data.roomCode;
            isHost = true;
            elements.roomCodeDisplay.textContent = data.roomCode;
            updateWaitingPlayers(data.players);
            elements.startGameBtn.style.display = 'block';
            elements.waitingMsg.textContent = 'You are host! Start game when players join.';
            showScreen('waiting');
        });

        socket.on('room_joined', (data) => {
            myId = socket.id;
            currentRoomCode = data.roomCode;
            isHost = data.player.isHost;
            elements.roomCodeDisplay.textContent = data.roomCode;
            updateWaitingPlayers(data.players);
            showScreen('waiting');
        });

        socket.on('join_error', (data) => showError(data.message));

        socket.on('player_joined', (data) => {
            updateWaitingPlayers(data.players);
            addChatMsg('system', `${data.player.name} joined!`);
        });

        socket.on('player_left', (data) => {
            updateWaitingPlayers(data.players);
            addChatMsg('system', `${data.playerName} left.`);
        });

        elements.startGameBtn.addEventListener('click', () => socket.emit('start_game'));

        socket.on('game_started', () => {
            showScreen('game');
            clearCanvas();
        });

        socket.on('choosing_phase', (data) => {
            gamePhase = 'choosing';
            isDrawer = (data.drawerId === socket.id);
            elements.wordDisplay.textContent = `${data.drawerName} is choosing word...`;
            elements.roundInfo.textContent = `Round ${data.roundNumber} of ${data.totalRounds}`;
            clearCanvas();
            updateGamePlayers(data.players);
        });

        socket.on('choose_word', (data) => {
            elements.wordChoicesList.innerHTML = '';
            data.words.forEach(word => {
                const btn = document.createElement('button');
                btn.className = 'word-choice-btn';
                btn.textContent = word;
                btn.onclick = () => {
                    socket.emit('word_chosen', { word: word });
                    elements.wordChoiceModal.classList.remove('show');
                };
                elements.wordChoicesList.appendChild(btn);
            });
            elements.wordChoiceModal.classList.add('show');
        });

        socket.on('round_started', (data) => {
            gamePhase = 'drawing';
            isDrawer = (data.drawerId === socket.id);
            elements.roundEndModal.classList.remove('show');
            if (!isDrawer) elements.wordDisplay.textContent = data.hint;
            updateGamePlayers(data.players);
        });

        socket.on('start_drawing', (data) => {
            elements.wordDisplay.textContent = data.word;
        });

        socket.on('timer_update', (data) => {
            elements.timerDisplay.textContent = `⏳ ${data.timeLeft}s`;
        });

        // CHAT & GUESSING
        function sendChat() {
            const text = elements.chatInput.value.trim();
            if (!text) return;
            socket.emit(gamePhase === 'drawing' && !isDrawer ? 'send_guess' : 'send_chat', { message: text });
            elements.chatInput.value = '';
        }

        elements.chatSendBtn.onclick = sendChat;
        elements.chatInput.onkeypress = (e) => { if (e.key === 'Enter') sendChat(); };

        socket.on('chat_message', (data) => addChatMsg('normal', `${data.senderName}: ${data.message}`));
        socket.on('correct_guess', (data) => addChatMsg('correct', `🎉 ${data.playerName} guessed it!`));

        function addChatMsg(type, msg) {
            const div = document.createElement('div');
            div.className = `msg msg-${type}`;
            div.textContent = msg;
            elements.chatMessages.appendChild(div);
            elements.chatMessages.scrollTop = elements.chatMessages.scrollHeight;
        }

        // DRAWING LOGIC
        let drawing = false;
        canvas.onmousedown = (e) => { if (!isDrawer) return; drawing = true; draw(e); };
        canvas.onmouseup = () => drawing = false;
        canvas.onmousemove = (e) => { if (drawing && isDrawer) draw(e); };

        function draw(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(x, y, 3, 0, Math.PI * 2);
            ctx.fill();

            socket.emit('draw_data', { type: 'dot', x: x, y: y, color: '#000000', size: 6 });
        }

        socket.on('draw_data', (data) => {
            ctx.fillStyle = data.color;
            ctx.beginPath();
            ctx.arc(data.x, data.y, data.size / 2, 0, Math.PI * 2);
            ctx.fill();
        });

        function clearCanvas() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function updateWaitingPlayers(players) {
            elements.waitingPlayersList.innerHTML = '';
            elements.waitingPlayerCount.textContent = Object.keys(players).length;
            Object.values(players).forEach(p => {
                const chip = document.createElement('div');
                chip.className = 'player-chip';
                chip.textContent = `${p.avatar} ${p.name}`;
                elements.waitingPlayersList.appendChild(chip);
            });
        }

        function updateGamePlayers(players) {
            elements.gamePlayerList.innerHTML = '';
            Object.values(players).forEach(p => {
                const div = document.createElement('div');
                div.style.padding = '6px';
                div.textContent = `${p.avatar} ${p.name} - ${p.score}pts`;
                elements.gamePlayerList.appendChild(div);
            });
        }
    </script>
</body>
</html>
